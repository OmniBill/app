<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftBill - Inventory Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4f46e5; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 flex flex-col justify-between hidden md:flex z-20">
        <div>
            <div class="p-6 border-b border-slate-800 flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-bolt text-white"></i>
                </div>
                <h1 class="text-2xl font-black bg-gradient-to-r from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent tracking-wide">SwiftBill</h1>
            </div>
            <nav class="p-4 space-y-2">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800/60 hover:text-white rounded-xl font-medium transition"><i class="fa-solid fa-chart-pie w-5"></i> Dashboard</a>
                <a href="billing.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800/60 hover:text-white rounded-xl font-medium transition"><i class="fa-solid fa-file-invoice-dollar w-5"></i> Billing</a>
                <a href="inventory.html" class="flex items-center gap-3 px-4 py-3 bg-gradient-to-r from-indigo-600 to-violet-600 text-white rounded-xl font-medium shadow-lg shadow-indigo-600/20"><i class="fa-solid fa-boxes-stacked w-5"></i> Inventory</a>
                <a href="reports.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800/60 hover:text-white rounded-xl font-medium transition"><i class="fa-solid fa-chart-line w-5"></i> Reports</a>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-800">
            <button id="logout-btn" class="flex items-center gap-3 w-full px-4 py-3 text-rose-400 hover:bg-rose-500/10 rounded-xl font-medium transition">
                <i class="fa-solid fa-right-from-bracket w-5"></i> Logout
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="bg-slate-900/50 backdrop-blur-md border-b border-slate-800/80 px-6 py-4 flex justify-between items-center z-10">
            <h2 class="text-xl font-bold text-white">Inventory Management</h2>
            <div id="user-email" class="text-sm text-slate-400 bg-slate-900 px-4 py-2 rounded-xl border border-slate-800">Loading...</div>
        </header>

        <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 p-6 overflow-y-auto">
            
            <!-- Left: Add Product Form (4 Cols) -->
            <div class="lg:col-span-4 bg-slate-900/60 backdrop-blur-xl border border-slate-800 p-6 rounded-2xl shadow-xl h-fit space-y-5">
                <h3 class="text-lg font-bold text-white flex items-center gap-2"><i class="fa-solid fa-plus-circle text-indigo-400"></i> Add New Product</h3>
                
                <form id="product-form" class="space-y-4">
                    <div>
                        <label class="block text-slate-300 text-xs font-bold uppercase tracking-wider mb-2">Product Name</label>
                        <input type="text" id="prod-name" required placeholder="Enter product name"
                            class="w-full px-4 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 text-sm font-medium">
                    </div>
                    <div>
                        <label class="block text-slate-300 text-xs font-bold uppercase tracking-wider mb-2">Price (₹)</label>
                        <input type="number" id="prod-price" step="0.01" required placeholder="0.00"
                            class="w-full px-4 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 text-sm font-medium">
                    </div>
                    <div>
                        <label class="block text-slate-300 text-xs font-bold uppercase tracking-wider mb-2">Stock Quantity</label>
                        <input type="number" id="prod-stock" required placeholder="0"
                            class="w-full px-4 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 text-sm font-medium">
                    </div>
                    <button type="submit" id="save-prod-btn"
                        class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200 text-sm tracking-wide flex items-center justify-center gap-2">
                        <i class="fa-solid fa-check">></i> Save Product
                    </button>
                </form>
            </div>

            <!-- Right: Product List Table (8 Cols) -->
            <div class="lg:col-span-8 bg-slate-900/60 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-xl flex flex-col overflow-hidden">
                <div class="p-5 border-b border-slate-800 bg-slate-900/50 flex justify-between items-center">
                    <h3 class="font-bold text-white flex items-center gap-2"><i class="fa-solid fa-boxes-stacked text-indigo-400"></i> Stock List</h3>
                    <input type="text" id="search-inventory" placeholder="Search inventory..." 
                        class="px-4 py-2 bg-slate-950/60 border border-slate-800 rounded-xl text-white text-xs placeholder-slate-600 focus:outline-none focus:border-indigo-500 w-64">
                </div>

                <div class="flex-1 overflow-y-auto p-4">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-800 text-slate-400 text-xs uppercase font-bold tracking-wider">
                                <th class="p-3">Product Name</th>
                                <th class="p-3">Price</th>
                                <th class="p-3">Stock</th>
                                <th class="p-3 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-table-body" class="divide-y divide-slate-800/60 text-sm">
                            <tr>
                                <td colspan="4" class="text-center py-12 text-slate-500">Loading inventory data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getDatabase, ref, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDzC-okomVG-pe08RH-JPp0s6NG1BBGIEE",
          authDomain: "a-one-chat-e3642.firebaseapp.com",
          databaseURL: "https://a-one-chat-e3642-default-rtdb.firebaseio.com",
          projectId: "a-one-chat-e3642",
          storageBucket: "a-one-chat-e3642.firebasestorage.app",
          messagingSenderId: "91366490582",
          appId: "1:91366490582:web:669e8a9bfc54f424a82477",
          measurementId: "G-T4WVE2QKXB"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let productsList = [];

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('user-email').textContent = user.email;
                fetchInventory();
            } else {
                window.location.href = 'index.html';
            }
        });

        // Add Product Form Handler
        document.getElementById('product-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('prod-name').value;
            const price = parseFloat(document.getElementById('prod-price').value);
            const stock = parseInt(document.getElementById('prod-stock').value);

            const prodRef = ref(db, 'products');
            const newProdRef = push(prodRef);
            
            set(newProdRef, { name, price, stock }).then(() => {
                document.getElementById('product-form').reset();
            }).catch(err => alert('Error adding product: ' + err.message));
        });

        // Fetch Inventory
        function fetchInventory() {
            onValue(ref(db, 'products'), (snapshot) => {
                const data = snapshot.val();
                const tbody = document.getElementById('inventory-table-body');
                tbody.innerHTML = '';
                productsList = [];

                if (data) {
                    Object.keys(data).forEach(key => {
                        productsList.push({ id: key, ...data[key] });
                    });
                    renderTable(productsList);
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-12 text-slate-500">No products found in inventory.</td></tr>';
                }
            });
        }

        function renderTable(products) {
            const tbody = document.getElementById('inventory-table-body');
            tbody.innerHTML = '';
            products.forEach(p => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/40 transition";
                tr.innerHTML = `
                    <td class="p-3 font-semibold text-white">${p.name}</td>
                    <td class="p-3 text-indigo-400 font-medium">₹${p.price}</td>
                    <td class="p-3"><span class="px-2.5 py-1 rounded-lg bg-emerald-500/10 text-emerald-400 text-xs font-bold">${p.stock}</span></td>
                    <td class="p-3 text-right">
                        <button class="w-8 h-8 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 flex items-center justify-center ml-auto transition delete-btn" data-id="${p.id}">
                            <i class="fa-solid fa-trash text-xs"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // Delete functionality
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    if (confirm('Are you sure you want to delete this product?')) {
                        remove(ref(db, `products/${id}`));
                    }
                });
            });
        }

        // Search Filter
        document.getElementById('search-inventory').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = productsList.filter(p => p.name && p.name.toLowerCase().includes(term));
            renderTable(filtered);
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = 'index.html');
        });
    </script>
</body>
</html>
