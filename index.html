<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftBill - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen">

    <div class="bg-slate-900/70 backdrop-blur-2xl border border-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-md mx-4">
        
        <div class="text-center mb-8">
            <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-bolt text-white text-2xl"></i>
            </div>
            <h1 id="form-title" class="text-3xl font-black text-white tracking-wide">Sign In</h1>
            <p id="form-desc" class="text-slate-400 text-sm mt-2">Welcome back to SwiftBill</p>
        </div>

        <form id="auth-form" class="space-y-5">
            <div>
                <label class="block text-slate-400 text-xs font-bold uppercase mb-2">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" id="email" required placeholder="name@example.com"
                        class="w-full pl-11 pr-4 py-3.5 bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:border-indigo-500 focus:outline-none transition text-sm">
                </div>
            </div>

            <div>
                <label class="block text-slate-400 text-xs font-bold uppercase mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" required placeholder="••••••••"
                        class="w-full pl-11 pr-4 py-3.5 bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:border-indigo-500 focus:outline-none transition text-sm">
                </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full py-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 transition text-sm">Sign In</button>
        </form>

        <div class="my-5 text-center text-slate-500 text-xs uppercase font-bold tracking-wider">OR</div>

        <button id="google-btn" class="w-full py-3.5 bg-white text-slate-900 font-bold rounded-xl hover:bg-slate-200 transition flex items-center justify-center gap-3 text-sm">
            <i class="fa-brands fa-google text-indigo-600"></i> Sign in with Google
        </button>

        <div class="mt-6 text-center text-sm text-slate-400">
            <span id="toggle-text">Don't have an account?</span> 
            <button id="toggle-btn" class="text-indigo-400 font-bold hover:underline ml-1">Sign Up</button>
        </div>
        
        <div id="error-msg" class="mt-4 p-3 bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs rounded-xl text-center hidden"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDzC-okomVG-pe08RH-JPp0s6NG1BBGIEE",
          authDomain: "a-one-chat-e3642.firebaseapp.com",
          databaseURL: "https://a-one-chat-e3642-default-rtdb.firebaseio.com",
          projectId: "a-one-chat-e3642",
          storageBucket: "a-one-chat-e3642.firebasestorage.app",
          messagingSenderId: "91366490582",
          appId: "1:91366490582:web:669e8a9bfc54f424a82477"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let isLogin = true;
        const form = document.getElementById('auth-form');
        const submitBtn = document.getElementById('submit-btn');
        const toggleBtn = document.getElementById('toggle-btn');
        const googleBtn = document.getElementById('google-btn');
        const errorMsg = document.getElementById('error-msg');

        toggleBtn.addEventListener('click', () => {
            isLogin = !isLogin;
            document.getElementById('form-title').textContent = isLogin ? 'Sign In' : 'Sign Up';
            submitBtn.textContent = isLogin ? 'Sign In' : 'Sign Up';
            document.getElementById('toggle-text').textContent = isLogin ? "Don't have an account?" : "Already have an account?";
            toggleBtn.textContent = isLogin ? "Sign Up" : "Sign In";
            errorMsg.classList.add('hidden');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                if (isLogin) {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                }
                window.location.href = '/app/dashboard.html';
            } catch (error) {
                errorMsg.textContent = error.message;
                errorMsg.classList.remove('hidden');
            }
        });

        googleBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
                window.location.href = '/app/dashboard.html';
            } catch (error) {
                errorMsg.textContent = error.message;
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
