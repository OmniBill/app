<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftBill - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white flex items-center justify-center min-h-screen">

    <div class="bg-slate-900 p-8 rounded-3xl shadow-2xl w-full max-w-sm border border-slate-800">
        <h1 id="form-title" class="text-2xl font-bold text-center mb-6">Sign In</h1>
        
        <form id="auth-form" class="space-y-4">
            <input type="email" id="email" placeholder="Email" required class="w-full p-3 bg-slate-950 border border-slate-700 rounded-lg">
            <input type="password" id="password" placeholder="Password" required class="w-full p-3 bg-slate-950 border border-slate-700 rounded-lg">
            <button type="submit" id="submit-btn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 rounded-lg font-bold">Sign In</button>
        </form>

        <div class="my-4 text-center text-slate-500">OR</div>

        <button id="google-btn" class="w-full py-3 bg-white text-black font-bold rounded-lg hover:bg-slate-200 transition">
            Sign in with Google
        </button>

        <p class="mt-6 text-center text-sm">
            <span id="toggle-text">Don't have an account?</span> 
            <button id="toggle-btn" class="text-indigo-400 font-bold underline">Sign Up</button>
        </p>
        <div id="error-msg" class="mt-4 text-rose-400 text-xs text-center hidden"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDzC-okomVG-pe08RH-JPp0s6NG1BBGIEE",
          authDomain: "a-one-chat-e3642.firebaseapp.com",
          projectId: "a-one-chat-e3642",
          storageBucket: "a-one-chat-e3642.firebasestorage.app",
          messagingSenderId: "91366490582",
          appId: "1:91366490582:web:669e8a9bfc54f424a82477"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider(); // Google Auth Provider

        let isLogin = true;
        const form = document.getElementById('auth-form');
        const toggleBtn = document.getElementById('toggle-btn');
        const googleBtn = document.getElementById('google-btn');
        const errorMsg = document.getElementById('error-msg');

        // Toggle Login/Signup
        toggleBtn.addEventListener('click', () => {
            isLogin = !isLogin;
            document.getElementById('form-title').textContent = isLogin ? 'Sign In' : 'Sign Up';
            document.getElementById('submit-btn').textContent = isLogin ? 'Sign In' : 'Sign Up';
            document.getElementById('toggle-text').textContent = isLogin ? "Don't have an account?" : "Already have an account?";
            toggleBtn.textContent = isLogin ? "Sign Up" : "Sign In";
        });

        // Email/Password Auth
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                if (isLogin) await signInWithEmailAndPassword(auth, email, password);
                else await createUserWithEmailAndPassword(auth, email, password);
                window.location.href = 'dashboard.html';
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.classList.remove('hidden');
            }
        });

        // Google Auth
        googleBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
                window.location.href = 'dashboard.html';
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
