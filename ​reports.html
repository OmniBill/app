<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftBill - Sales Reports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4f46e5; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 flex flex-col justify-between hidden md:flex z-20">
        <div>
            <div class="p-6 border-b border-slate-800 flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-bolt text-white"></i>
                </div>
                <h1 class="text-2xl font-black bg-gradient-to-r from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent tracking-wide">SwiftBill</h1>
            </div>
            <nav class="p-4 space-y-2">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800/60 hover:text-white rounded-xl font-medium transition"><i class="fa-solid fa-chart-pie w-5"></i> Dashboard</a>
                <a href="billing.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800/60 hover:text-white rounded-xl font-medium transition"><i class="fa-solid fa-file-invoice-dollar w-5"></i> Billing</a>
                <a href="inventory.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800/60 hover:text-white rounded-xl font-medium transition"><i class="fa-solid fa-boxes-stacked w-5"></i> Inventory</a>
                <a href="reports.html" class="flex items-center gap-3 px-4 py-3 bg-gradient-to-r from-indigo-600 to-violet-600 text-white rounded-xl font-medium shadow-lg shadow-indigo-600/20"><i class="fa-solid fa-chart-line w-5"></i> Reports</a>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-800">
            <button id="logout-btn" class="flex items-center gap-3 w-full px-4 py-3 text-rose-400 hover:bg-rose-500/10 rounded-xl font-medium transition">
                <i class="fa-solid fa-right-from-bracket w-5"></i> Logout
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="bg-slate-900/50 backdrop-blur-md border-b border-slate-800/80 px-6 py-4 flex justify-between items-center z-10">
            <h2 class="text-xl font-bold text-white">Sales Reports & History</h2>
            <div id="user-email" class="text-sm text-slate-400 bg-slate-900 px-4 py-2 rounded-xl border border-slate-800">Loading...</div>
        </header>

        <div class="flex-1 p-6 overflow-y-auto space-y-6">
            
            <!-- Summary Stats Card -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-slate-900/60 border border-slate-800 p-6 rounded-2xl shadow-xl backdrop-blur-xl">
                    <p class="text-slate-400 text-xs font-bold uppercase">Total Revenue Collected</p>
                    <h3 id="total-revenue" class="text-3xl font-black text-indigo-400 mt-2">₹ 0.00</h3>
                </div>
                <div class="bg-slate-900/60 border border-slate-800 p-6 rounded-2xl shadow-xl backdrop-blur-xl">
                    <p class="text-slate-400 text-xs font-bold uppercase">Total Bills Generated</p>
                    <h3 id="total-bills-count" class="text-3xl font-black text-emerald-400 mt-2">0</h3>
                </div>
            </div>

            <!-- Bills History Table Container -->
            <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-xl flex flex-col overflow-hidden">
                <div class="p-5 border-b border-slate-800 bg-slate-900/50 flex justify-between items-center">
                    <h3 class="font-bold text-white flex items-center gap-2"><i class="fa-solid fa-file-invoice text-indigo-400"></i> Recent Bills History</h3>
                </div>

                <div class="flex-1 overflow-y-auto p-4">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-800 text-slate-400 text-xs uppercase font-bold tracking-wider">
                                <th class="p-3">Bill ID / Date</th>
                                <th class="p-3">Cashier</th>
                                <th class="p-3">Items Count</th>
                                <th class="p-3 text-right">Grand Total</th>
                            </tr>
                        </thead>
                        <tbody id="reports-table-body" class="divide-y divide-slate-800/60 text-sm">
                            <tr>
                                <td colspan="4" class="text-center py-12 text-slate-500">Loading bills history...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDzC-okomVG-pe08RH-JPp0s6NG1BBGIEE",
          authDomain: "a-one-chat-e3642.firebaseapp.com",
          databaseURL: "https://a-one-chat-e3642-default-rtdb.firebaseio.com",
          projectId: "a-one-chat-e3642",
          storageBucket: "a-one-chat-e3642.firebasestorage.app",
          messagingSenderId: "91366490582",
          appId: "1:91366490582:web:669e8a9bfc54f424a82477",
          measurementId: "G-T4WVE2QKXB"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('user-email').textContent = user.email;
                fetchReports();
            } else {
                window.location.href = 'index.html';
            }
        });

        function fetchReports() {
            onValue(ref(db, 'bills'), (snapshot) => {
                const data = snapshot.val();
                const tbody = document.getElementById('reports-table-body');
                tbody.innerHTML = '';

                if (data) {
                    let totalRevenue = 0;
                    let billsArray = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                    
                    // Sort by newest first
                    billsArray.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                    document.getElementById('total-bills-count').textContent = billsArray.length;

                    billsArray.forEach(bill => {
                        totalRevenue += bill.grandTotal || 0;
                        const dateStr = new Date(bill.timestamp).toLocaleString();
                        const itemsCount = bill.items ? bill.items.reduce((sum, item) => sum + item.quantity, 0) : 0;

                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-slate-800/40 transition";
                        tr.innerHTML = `
                            <td class="p-3">
                                <span class="font-bold text-white text-xs block">#${bill.id.slice(-6)}</span>
                                <span class="text-xs text-slate-400">${dateStr}</span>
                            </td>
                            <td class="p-3 text-slate-300 text-xs">${bill.cashier || 'N/A'}</td>
                            <td class="p-3"><span class="px-2.5 py-1 rounded-lg bg-indigo-500/10 text-indigo-400 text-xs font-bold">${itemsCount} items</span></td>
                            <td class="p-3 text-right font-bold text-emerald-400">₹${(bill.grandTotal || 0).toFixed(2)}</td>
                        `;
                        tbody.appendChild(tr);
                    });

                    document.getElementById('total-revenue').textContent = `₹ ${totalRevenue.toFixed(2)}`;
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-12 text-slate-500">No bills generated yet.</td></tr>';
                    document.getElementById('total-revenue').textContent = '₹ 0.00';
                    document.getElementById('total-bills-count').textContent = '0';
                }
            });
        }

        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = 'index.html');
        });
    </script>
</body>
</html>
