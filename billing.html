<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftBill - Billing Counter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen overflow-hidden">

    <aside class="w-64 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 flex flex-col justify-between hidden md:flex z-20">
        <div>
            <div class="p-6 border-b border-slate-800 flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-bolt text-white"></i>
                </div>
                <h1 class="text-2xl font-black bg-gradient-to-r from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent tracking-wide">SwiftBill</h1>
            </div>
            <nav class="p-4 space-y-2">
                <a href="/app/dashboard.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800/60 hover:text-white rounded-xl font-medium transition"><i class="fa-solid fa-chart-pie w-5"></i> Dashboard</a>
                <a href="/app/billing.html" class="flex items-center gap-3 px-4 py-3 bg-gradient-to-r from-indigo-600 to-violet-600 text-white rounded-xl font-medium shadow-lg shadow-indigo-600/20"><i class="fa-solid fa-file-invoice-dollar w-5"></i> Billing</a>
                <a href="/app/inventory.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800/60 hover:text-white rounded-xl font-medium transition"><i class="fa-solid fa-boxes-stacked w-5"></i> Inventory</a>
                <a href="/app/reports.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800/60 hover:text-white rounded-xl font-medium transition"><i class="fa-solid fa-chart-line w-5"></i> Reports</a>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-800">
            <button id="logout-btn" class="flex items-center gap-3 w-full px-4 py-3 text-rose-400 hover:bg-rose-500/10 rounded-xl font-medium transition">
                <i class="fa-solid fa-right-from-bracket w-5"></i> Logout
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="bg-slate-900/50 backdrop-blur-md border-b border-slate-800/80 px-6 py-4 flex justify-between items-center z-10">
            <h2 class="text-xl font-bold text-white">Billing Counter</h2>
            <div id="user-email" class="text-sm text-slate-400 bg-slate-900 px-4 py-2 rounded-xl border border-slate-800">Loading...</div>
        </header>

        <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 p-6 overflow-y-auto">
            <div class="lg:col-span-7 flex flex-col space-y-4">
                <div class="bg-slate-900/60 border border-slate-800 p-4 rounded-2xl shadow-xl flex items-center gap-3">
                    <i class="fa-solid fa-magnifying-glass text-slate-400 ml-2"></i>
                    <input type="text" id="search-product" placeholder="Search products..." class="w-full bg-transparent text-white placeholder-slate-500 focus:outline-none text-sm">
                </div>
                <div class="flex-1 bg-slate-900/40 border border-slate-800/80 rounded-2xl p-4 overflow-y-auto min-h-[400px]">
                    <div id="products-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                        <div class="col-span-full text-center py-12 text-slate-500 text-sm">Loading inventory items...</div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-5 flex flex-col bg-slate-900/80 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
                <div class="p-4 border-b border-slate-800 bg-slate-900/50 flex justify-between items-center">
                    <h3 class="font-bold text-white flex items-center gap-2"><i class="fa-solid fa-cart-shopping text-indigo-400"></i> Current Bill</h3>
                    <button id="clear-cart" class="text-xs text-rose-400 hover:text-rose-300 font-semibold">Clear All</button>
                </div>
                <div class="flex-1 overflow-y-auto p-4 space-y-3" id="cart-items-container">
                    <div class="text-center py-16 text-slate-500 text-sm">Cart is empty.</div>
                </div>
                <div class="p-5 border-t border-slate-800 bg-slate-900/90 space-y-4">
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between text-slate-400"><span>Subtotal</span><span id="subtotal-amount" class="text-slate-200 font-semibold">₹0.00</span></div>
                        <div class="flex justify-between text-slate-400"><span>GST (5%)</span><span id="tax-amount" class="text-slate-200 font-semibold">₹0.00</span></div>
                        <div class="flex justify-between text-lg font-bold text-white pt-2 border-t border-slate-800"><span>Grand Total</span><span id="grand-total" class="text-indigo-400">₹0.00</span></div>
                    </div>
                    <button id="complete-checkout" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-print"></i> Complete & Print Bill
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDzC-okomVG-pe08RH-JPp0s6NG1BBGIEE",
          authDomain: "a-one-chat-e3642.firebaseapp.com",
          databaseURL: "https://a-one-chat-e3642-default-rtdb.firebaseio.com",
          projectId: "a-one-chat-e3642",
          storageBucket: "a-one-chat-e3642.firebasestorage.app",
          messagingSenderId: "91366490582",
          appId: "1:91366490582:web:669e8a9bfc54f424a82477"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let cart = [];
        let allProducts = [];

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('user-email').textContent = user.email;
                fetchProducts();
            } else {
                window.location.href = '/app/index.html';
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = '/app/index.html');
        });

        function fetchProducts() {
            onValue(ref(db, 'products'), (snapshot) => {
                const data = snapshot.val();
                const grid = document.getElementById('products-grid');
                grid.innerHTML = '';
                allProducts = [];
                if (data) {
                    Object.keys(data).forEach((key) => {
                        allProducts.push({ id: key, ...data[key] });
                    });
                    renderProducts(allProducts);
                } else {
                    grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500 text-sm">No products found.</div>';
                }
            });
        }

        function renderProducts(products) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 hover:border-indigo-500/50 p-4 rounded-xl flex flex-col justify-between cursor-pointer transition group";
                card.innerHTML = `
                    <div>
                        <h4 class="font-bold text-white group-hover:text-indigo-400 transition">${product.name}</h4>
                        <p class="text-xs text-slate-400 mt-1">Stock: <span class="text-emerald-400 font-semibold">${product.stock}</span></p>
                    </div>
                    <div class="flex justify-between items-center mt-4">
                        <span class="text-indigo-400 font-bold">₹${product.price}</span>
                        <span class="w-8 h-8 rounded-lg bg-indigo-600/20 text-indigo-400 flex items-center justify-center group-hover:bg-indigo-600 group-hover:text-white transition"><i class="fa-solid fa-plus text-xs"></i></span>
                    </div>
                `;
                card.addEventListener('click', () => addToCart(product));
                grid.appendChild(card);
            });
        }

        document.getElementById('search-product').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            renderProducts(allProducts.filter(p => p.name.toLowerCase().includes(term)));
        });

        function addToCart(product) {
            const existing = cart.find(item => item.id === product.id);
            if (existing) existing.quantity += 1;
            else cart.push({ ...product, quantity: 1 });
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items-container');
            container.innerHTML = '';
            if (cart.length === 0) {
                container.innerHTML = '<div class="text-center py-16 text-slate-500 text-sm">Cart is empty.</div>';
                updateTotals();
                return;
            }
            cart.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = "bg-slate-900/90 border border-slate-800 p-3 rounded-xl flex justify-between items-center";
                itemDiv.innerHTML = `
                    <div class="overflow-hidden mr-2">
                        <h5 class="font-semibold text-white text-sm truncate">${item.name}</h5>
                        <p class="text-xs text-indigo-400 font-medium">₹${item.price} × ${item.quantity}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button class="w-7 h-7 rounded-lg bg-slate-800 text-slate-300 flex items-center justify-center text-xs decrease-qty" data-index="${index}"><i class="fa-solid fa-minus"></i></button>
                        <span class="text-sm font-bold w-5 text-center">${item.quantity}</span>
                        <button class="w-7 h-7 rounded-lg bg-slate-800 text-slate-300 flex items-center justify-center text-xs increase-qty" data-index="${index}"><i class="fa-solid fa-plus"></i></button>
                    </div>
                `;
                container.appendChild(itemDiv);
            });

            document.querySelectorAll('.increase-qty').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    cart[e.currentTarget.getAttribute('data-index')].quantity += 1;
                    renderCart();
                });
            });

            document.querySelectorAll('.decrease-qty').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = e.currentTarget.getAttribute('data-index');
                    cart[idx].quantity -= 1;
                    if (cart[idx].quantity <= 0) cart.splice(idx, 1);
                    renderCart();
                });
            });
            updateTotals();
        }

        function updateTotals() {
            let subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            let tax = subtotal * 0.05;
            document.getElementById('subtotal-amount').textContent = `₹${subtotal.toFixed(2)}`;
            document.getElementById('tax-amount').textContent = `₹${tax.toFixed(2)}`;
            document.getElementById('grand-total').textContent = `₹${(subtotal + tax).toFixed(2)}`;
        }

        document.getElementById('clear-cart').addEventListener('click', () => { cart = []; renderCart(); });

        document.getElementById('complete-checkout').addEventListener('click', () => {
            if (cart.length === 0) { alert('Cart is empty!'); return; }
            let subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            let tax = subtotal * 0.05;
            set(push(ref(db, 'bills')), {
                items: cart, subtotal, tax, grandTotal: subtotal + tax,
                timestamp: new Date().toISOString(), cashier: auth.currentUser.email
            }).then(() => { alert('Bill completed!'); cart = []; renderCart(); });
        });
    </script>
</body>
</html>
